[package]
name = "danmaku_timeline_studio"
version = "0.1.0"
description = "Danmaku Timeline Studio desktop shell"
authors = ["Danmaku Timeline Studio Contributors"]
edition = "2021"

[lib]
name = "danmaku_timeline_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
sha2 = "0.10"
