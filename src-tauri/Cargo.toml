[package]
name = "danmaku_timeline_studio"
version = "0.1.0"
description = "Danmaku Timeline Studio desktop shell"
authors = ["Danmaku Timeline Studio Contributors"]
edition = "2021"

[lib]
name = "danmaku_timeline_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
sha2 = "0.10"
cudarc = { version = "=0.19.8", default-features = false, features = [
  "std",
  "driver",
  "cufft",
  "dynamic-loading",
  "cuda-13000",
] }
libloading = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }
